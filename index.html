<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord mobile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sigmar&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

</head>
<body>

    <header>
        <img id="banner" src="./img/banner.png" alt="Discord banner">
    </header>

    <main>

        <section id="intro">
            <h1 id="title">GROUP CHAT THAT'S ALL FUN &amp GAMES</h1>
            <p id="opening-p">

            <button id="download-button"><i class="bi bi-cloud-download"></i>Download for Windows</button>

        </section>
        <!-- /#intro -->




    </main>
